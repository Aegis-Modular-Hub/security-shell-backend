spring:
    datasource:
        url: jdbc:postgresql://localhost:5432/aegis_hub
        username: postgres
        password: secret
    jpa:
        hibernate:
            ddl-auto: update
        show-sql: true
        properties:
            hibernate:
                format_sql: true
                default_schema: public
                javax.persistence.schema-generation.create-source: metadata
                scripts.action: create
